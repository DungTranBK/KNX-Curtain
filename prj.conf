# Bluetooth Mesh Relay Node Configuration
# Nordic SDK 3.0.1
# Optimized for Relay + Friend Node in Bluetooth Mesh network
###############################################################################

# =============================================================================
# 0. TF-M CONFIGURATION
# =============================================================================
# Disable TF-M logging để không dùng UART30 (tránh conflict với UART00)
# Khi disable logging, TF-M sẽ không claim UART30 và GPIO pins
CONFIG_TFM_LOG_LEVEL_SILENCE=y

# Disable secure pins cho GPIO0.0-0.1 để UART00 có thể dùng được
# Mặc định TF-M claim GPIO0.0-0.1 làm secure (0x00000003)
# Set về 0x00000000 để cho phép non-secure access
CONFIG_NRF_GPIO0_PIN_MASK_SECURE=0x00000000


#DEBUG CONFIG
CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_LOGGING=y


# =============================================================================
# 1. SYSTEM & HARDWARE CONFIGURATION
# =============================================================================
# Basic system configuration: stack size, storage, hardware info
# Increase stack size for relay node handling many messages simultaneously

CONFIG_MAIN_STACK_SIZE=5120
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=5120

# Storage & Settings
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_NVS_LOOKUP_CACHE=y
CONFIG_SETTINGS_NVS_NAME_CACHE=y
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0x8000

# Clock Configuration (Internal RC - frees P0.00/P0.01 for relay4 GPIO)
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF=y
CONFIG_SOC_ENABLE_LFXO=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y

# TF-M Secure UART30 Configuration
# This tells TF-M to use UART30 during secure boot on P0.00/P0.01,
# which grants Non-Secure access to those pins so the relay driver
# can reconfigure them as GPIO after boot.
CONFIG_TFM_SECURE_UART30=y
CONFIG_TFM_SECURE_UART_SHARE_INSTANCE=y

# Hardware & Libraries
CONFIG_HWINFO=y
CONFIG_DK_LIBRARY=y
CONFIG_GPIO=y
CONFIG_GPIO_NRFX=y
# I2C for AT24C02 EEPROM (software bit-bang on P2.0/P2.1)
CONFIG_I2C=y
CONFIG_I2C_GPIO=y

# Tắt driver flash ngoài (board có chip flash MX25R64 nhưng project không dùng)
CONFIG_SPI_NOR=n

# Button Configuration
# Number of buttons defined in include/button.h via MAX_BUTTON_COUNT macro
# Default: 4 buttons
# To change, modify MAX_BUTTON_COUNT in include/button.h

# Reboot functionality (for factory reset)
CONFIG_REBOOT=y

# Watchdog configuration - Protects system from hanging
# IMPORTANT: CONFIG_WATCHDOG must be enabled before CONFIG_WDT_NRFX
CONFIG_WATCHDOG=y
CONFIG_WDT_NRFX=y
CONFIG_WDT_DISABLE_AT_BOOT=n

# Cryptography & Random Generator
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_CONSOLE=y
CONFIG_USE_SEGGER_RTT=n

# Ring Buffer for Serial Layer
# Ring Buffer for Serial Layer
CONFIG_RING_BUFFER=y

# Enable SPI for spi22
# Enabling SPI for WS2812
CONFIG_LED_STRIP=n
CONFIG_WS2812_STRIP_GPIO=n
# Enable SPI/I2S for WS2812
CONFIG_SPI=n
CONFIG_SPI_NRFX=n
CONFIG_I2S=n
CONFIG_WS2812_STRIP_SPI=n
CONFIG_WS2812_STRIP_I2S=n



# =============================================================================
# 2. BLUETOOTH CORE CONFIGURATION
# =============================================================================
# Cấu hình Bluetooth Low Energy cơ bản

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y
# Tăng L2CAP buffers cho GATT Proxy (nếu sử dụng)
CONFIG_BT_L2CAP_TX_BUF_COUNT=16


# =============================================================================
# 3. BLUETOOTH CONTROLLER FEATURES (DISABLED FOR OPTIMIZATION)
# =============================================================================
# Tắt các tính năng không cần thiết để tối ưu performance và tiết kiệm năng lượng

CONFIG_BT_CTLR_LE_ENC=n
CONFIG_BT_CTLR_LE_PING=n
CONFIG_BT_DATA_LEN_UPDATE=n
CONFIG_BT_PHY_UPDATE=n
CONFIG_BT_CTLR_MIN_USED_CHAN=n
CONFIG_BT_CTLR_PRIVACY=n
CONFIG_BT_CTLR_CHAN_SEL_2=n


# =============================================================================
# 4. BLUETOOTH MESH CORE
# =============================================================================
# Enable Bluetooth Mesh stack

CONFIG_BT_MESH=y


# =============================================================================
# 5. RELAY & FRIEND NODE FEATURES
# =============================================================================
# Relay Node: Forward messages giữa các nodes trong mesh network
# Friend Node: Hỗ trợ Low Power Nodes (LPN) bằng cách lưu trữ messages

# Relay Feature - Quan trọng cho relay node
# Tăng buffer count để xử lý nhiều messages đồng thời
# Tăng retransmit count để đảm bảo độ tin cậy cao hơn
CONFIG_BT_MESH_RELAY=y
CONFIG_BT_MESH_NETWORK_TRANSMIT_COUNT=5
CONFIG_BT_MESH_NETWORK_TRANSMIT_INTERVAL=30
CONFIG_BT_MESH_RELAY_RETRANSMIT_COUNT=2
CONFIG_BT_MESH_RELAY_RETRANSMIT_INTERVAL=30

# Friend Feature - Hỗ trợ Low Power Nodes
# Friend node lưu trữ messages cho LPN và gửi khi LPN wake up
# Tăng queue size để hỗ trợ nhiều LPN đồng thời
CONFIG_BT_MESH_FRIEND=y
CONFIG_BT_MESH_FRIEND_LPN_COUNT=5
CONFIG_BT_MESH_FRIEND_QUEUE_SIZE=16
CONFIG_BT_MESH_FRIEND_RECV_WIN=49

# 1. Extended Advertising (bắt buộc cho Friend ADV riêng)
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=6

# 2. Mesh Extended Advertising mode
CONFIG_BT_MESH_ADV_EXT=y

# 3. Friend ADV Optimization (randomness=0, send immediately)
CONFIG_BT_MESH_ADV_EXT_FRIEND_SEPARATE=y

# High priority for Mesh ADV thread to reduce jitter (0 = Highest Cooperative Prio)
CONFIG_BT_MESH_ADV_PRIO=0

# Low Power Node - Disable (đây là relay node, luôn hoạt động)
CONFIG_BT_MESH_LOW_POWER=n


# =============================================================================
# 6. NETWORK CONFIGURATION & TOPOLOGY
# =============================================================================
# Cấu hình network: số lượng subnet, app key, groups, labels
# Network transmit/receive: số lần retry và interval

# Network Capacity
CONFIG_BT_MESH_SUBNET_COUNT=2
CONFIG_BT_MESH_APP_KEY_COUNT=2
CONFIG_BT_MESH_MODEL_GROUP_COUNT=8
CONFIG_BT_MESH_LABEL_COUNT=2

# Model Key Slots - Tăng để bind với nhiều AppKeys
# Fast Provision model cần bind với cả default network (0x0001) và main network (0x0000)
CONFIG_BT_MESH_MODEL_KEY_COUNT=2

# Default TTL (Time To Live) - Số hop tối đa message có thể đi qua
CONFIG_BT_MESH_DEFAULT_TTL=6

# =============================================================================
# 7. MESSAGE BUFFER & PERFORMANCE CONFIGURATION
# =============================================================================
# Tối ưu buffer sizes để relay node có thể xử lý nhiều messages đồng thời

# Advertisement Buffers - Tăng để giảm message loss
# Relay node cần nhiều buffers hơn để xử lý traffic cao
CONFIG_BT_MESH_ADV_BUF_COUNT=32
# FIX: Tăng relay buffer count riêng cho relay messages
CONFIG_BT_MESH_RELAY_BUF_COUNT=32
# FIX: Tăng segment max để xử lý large messages
CONFIG_BT_MESH_TX_SEG_MAX=8
CONFIG_BT_MESH_RX_SEG_MAX=8
# FIX: Tăng từ 2 lên 4 để nhận nhiều segmented messages đồng thời
CONFIG_BT_MESH_RX_SEG_MSG_COUNT=4

# Loopback Buffers - Cho internal message routing
# Tăng cho relay node xử lý nhiều messages nội bộ
CONFIG_BT_MESH_LOOPBACK_BUFS=24


# No random response msg
CONFIG_BT_MESH_ACCESS_DELAYABLE_MSG=y

# =============================================================================
# 8. SECURITY & BEACON CONFIGURATION
# =============================================================================
# Secure Network Beacon: quảng bá thông tin security cho các nodes

CONFIG_BT_MESH_BEACON_ENABLED=y


# =============================================================================
# 9. PROVISIONING CONFIGURATION
# =============================================================================
# Cấu hình provisioning: cách thiết bị được thêm vào mesh network

CONFIG_BT_MESH_PROVISIONEE=y
CONFIG_BT_MESH_DK_PROV=y
CONFIG_BT_MESH_DK_PROV_OOB_BUTTON=n

# Provisioning Bearer: chỉ dùng PB-ADV (Advertising)
CONFIG_BT_MESH_PB_ADV=y
CONFIG_BT_MESH_PB_GATT=y


# =============================================================================
# 10. GATT PROXY CONFIGURATION
# =============================================================================
# GATT Proxy: cho phép thiết bị BLE kết nối vào mesh network qua GATT

CONFIG_BT_MESH_GATT_PROXY=y


# =============================================================================
# 11. APPLICATION MODELS
# =============================================================================
# Bluetooth Mesh models used in the application

# Foundation Models (bắt buộc)
CONFIG_BT_MESH_CFG_CLI=y

# Health Model
CONFIG_BT_MESH_HEALTH_CLI=y

# Generic OnOff manual implementation is used, keeping standard server config 
# for opcodes/structs but using custom handlers in mesh_node.c
CONFIG_BT_MESH_ONOFF_SRV=y
CONFIG_BT_MESH_ONOFF_CLI=y

# Scene Model
CONFIG_BT_MESH_SCENE_SRV=y
CONFIG_BT_MESH_SCENES_MAX=16

# Generic Default Transition Time Server (Required for Scene Model)
CONFIG_BT_MESH_DTT_SRV=y

# Sensor Model - DISABLED
# CONFIG_BT_MESH_SENSOR_SRV=y


# =============================================================================
# 12. STORAGE & SETTINGS CONFIGURATION
# =============================================================================
# Configuration to save mesh state to flash to persist after reset

CONFIG_BT_SETTINGS=y
# RPL (Replay Protection List) Store Timeout
# Set to -1 to DISABLE automatic storage to Flash (RAM only)
CONFIG_BT_MESH_RPL_STORE_TIMEOUT=-1

# =============================================================================
# 13. LOGGING CONFIGURATION
# =============================================================================
# Log level: INF for production (reduce log to increase performance)
# Can change to DBG for debugging when needed

CONFIG_LOG=y
CONFIG_BT_LOG_LEVEL_INF=y
CONFIG_BT_MESH_LOG_LEVEL_INF=y
CONFIG_BT_MESH_PROV_LOG_LEVEL_INF=y
CONFIG_BT_MESH_MODEL_LOG_LEVEL_INF=y
CONFIG_BT_MESH_NET_LOG_LEVEL_INF=y
CONFIG_BT_MESH_ACCESS_LOG_LEVEL_INF=y

# =============================================================================
# 14. DEBUG & DEVELOPMENT TOOLS (OPTIONAL)
# =============================================================================
# Uncomment các dòng dưới để enable debug tools khi cần

# CONFIG_BT_MESH_PROVISIONEE_LOG_LEVEL_DBG=y
# CONFIG_BT_GATT_LOG_LEVEL_DBG=y
# CONFIG_BT_MESH_PROXY_LOG_LEVEL_DBG=y
# CONFIG_STACK_CANARIES=y
CONFIG_ASSERT=y
# CONFIG_THREAD_ANALYZER=y
# CONFIG_THREAD_ANALYZER_USE_PRINTK=y
# CONFIG_THREAD_ANALYZER_AUTO=y
# CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096


# =============================================================================
# 15. DEBUG FEATURES
# =============================================================================
# Only enable in development, disable in production for optimal performance

CONFIG_BT_MESH_DEBUG_USE_ID_ADDR=y
CONFIG_BT_MESH_ACCESS_LAYER_MSG=y
CONFIG_BT_MESH_ACCESS_DELAYABLE_MSG=y

# =============================================================================
# 17. RELAY NODE OPTIMIZATION
# =============================================================================
# Special optimizations for relay node
# Message cache và network segmentation đã được cấu hình ở trên


# =============================================================================
# 16. HARDWARE TX POWER CONFIGURATION
# =============================================================================
# TX Power: 8dBm to increase coverage for relay node
# Can be adjusted based on range and energy consumption requirements

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y  # Uncomment để điều khiển dynamic



# Replay Protection List Size - Increase for 512 nodes
CONFIG_BT_MESH_CRPL=512

# Message Cache Size - Increase duplicate buffer (Default 10/32)
CONFIG_BT_MESH_MSG_CACHE_SIZE=64

# Zbus for inter-module communication (KNX Adapter <-> App)
CONFIG_ZBUS=y

# =============================================================================
# 18. C++ SUPPORT (Required for KNX Stack)
# =============================================================================
# KNX stack uses C++ with new/delete operators - must enable C++ in Zephyr
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_HEAP_MEM_POOL_SIZE=8192
